# ==============================================================================
# Configuração de conexão com o banco.
# Em produção/Docker, esses valores vêm de variáveis de ambiente (ver
# docker-compose.yml na raiz do projeto). Os valores abaixo são apenas o
# fallback para rodar a API localmente fora de container.
# ==============================================================================

db.url=${DB_URL:jdbc:postgresql://localhost:5432/almoxaf}
db.user=${DB_USER:almoxaf}
db.password=${DB_PASSWORD:almoxaf_dev_password}

# Pool de conexões (HikariCP)
db.pool.maxSize=${DB_POOL_MAX_SIZE:10}
db.pool.minIdle=${DB_POOL_MIN_IDLE:2}
db.pool.connectionTimeoutMs=${DB_POOL_CONN_TIMEOUT_MS:5000}
