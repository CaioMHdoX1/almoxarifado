server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja um arquivo real cai no index.html
    # (importante para quando entrarmos com o TanStack Router — rotas como
    # /usuarios/novo precisam ser resolvidas pelo React, não pelo Nginx).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome (Vite já faz isso) podem cachear por muito tempo
    location ~* \.(?:js|css|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
