name: Validação de Código

# Dispara o teste sempre que houver um push para qualquer branch
on: [push]

jobs:
  testar-codigo:
    # Aqui define que vai rodar em uma máquina virtual Linux (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do seu repositório na máquina Linux
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Instala o Node.js na máquina
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Instala as dependências do projeto frontend (dentro da pasta client)
      - name: Instalar dependências do Client
        run: npm ci --prefix client

      # 4. Roda as suas ferramentas de checagem apontando para a pasta client
      - name: Executar Biome Linter
        run: npm --prefix client run biome:fix || true

      - name: Executar Type Check (TypeScript)
        run: npm --prefix client run type:check