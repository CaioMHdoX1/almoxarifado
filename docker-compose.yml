services:
  db:
    image: postgres:15
    container_name: almoxaf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: almoxaf
      POSTGRES_PASSWORD: almoxaf_dev_password
      POSTGRES_DB: almoxaf
    ports:
      - "5432:5432"
    volumes:
      - almoxaf_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almoxaf -d almoxaf"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: almoxaf-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@almoxaf.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - almoxaf_pgadmin_data:/var/lib/pgadmin

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: almoxaf-api
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/almoxaf
      DB_USER: almoxaf
      DB_PASSWORD: almoxaf_dev_password
      # Lista separada por vírgula — libera tanto o Vite em dev (5173)
      # quanto este client rodando via Docker (3000), ao mesmo tempo.
      CLIENT_ORIGIN: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Endereço que o NAVEGADOR usa pra falar com a API — precisa ser
        # localhost:8080 (a porta publicada no host), não "api:8080" (nome
        # do serviço só é resolvível *dentro* da rede do Docker, não pelo
        # navegador rodando na sua máquina).
        VITE_API_URL: http://localhost:8080
    container_name: almoxaf-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  almoxaf_db_data:
  almoxaf_pgadmin_data:
